description: |
  This is the first round of selection of the Australian team for APhO. These questions try to test both your theoretical understanding and your "physical inquiry skills" (e.g. experimental skills, knowledge of error sources, physical intuition). It's pretty basic and is designed to be accessible to everyone, so it only has algebra based physics (since the latest you can do the exams is mid-grade 11 and the Australian curriculum doesn't teach calculus until after the exams happen).

  I highly recommend starting here if you're just starting out your physics olympiad journey. It's really good for consolidating your understanding and theoretical knowledge (which is arguably the most important part of physics olympiads) without too much mathematical background needed. If you are just starting, good luck and never give up! -Owen from Australia.
  
  Be sure to consult the [Errata](https://www.physicsforums.com/insights/corrections-to-the-australian-physics-olympiad-questions-and-solutions/)! Even test writers get things wrong...
